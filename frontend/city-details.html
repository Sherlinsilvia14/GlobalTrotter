<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Details - ThisAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Specific Styles for City Details */
        .hero-banner {
            height: 400px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
        }

        .hero-overlay {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.8));
            position: absolute;
            top: 0;
            left: 0;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 3rem;
            color: white;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .hero-dates {
            font-size: 1.2rem;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spots-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .spots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        .spot-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s;
        }

        .spot-card:hover {
            transform: translateY(-5px);
        }

        .spot-image {
            height: 180px;
            background-size: cover;
            background-position: center;
        }

        .spot-body {
            padding: 1.5rem;
        }

        .spot-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .spot-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .back-nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>

    <header class="visually-hidden">
        <!-- Hidden header just for consistent structure if needed, focusing on Hero -->
    </header>

    <div id="loading" style="text-align:center; padding: 5rem;">Loading Details...</div>

    <div id="city-content" style="display:none;">
        <div class="hero-banner" id="city-banner">
            <div class="back-nav">
                <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title" id="city-name">City Name</h1>
                <div class="hero-dates">
                    <i class="far fa-calendar-alt"></i> <span id="city-dates">Dates</span>
                </div>
                <p id="city-desc" style="margin-top: 1rem; max-width: 600px; line-height: 1.5;">Description goes here...
                </p>
            </div>
        </div>

        <main class="spots-container">
            <div class="section-header">
                <h2>Top Attractions</h2>
                <button class="btn-action edit" onclick="alert('Add Spot feature coming soon!')">+ Add Spot</button>
            </div>

            <div class="spots-grid" id="spots-grid">
                <!-- Spots injected here -->
            </div>
        </main>
    </div>

    <script src="city-details.js"></script>
</body>

</html>
