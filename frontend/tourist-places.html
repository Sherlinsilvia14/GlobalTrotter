<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Places | THISAI</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="city-style.css">
</head>

<body>

    <!-- Header -->
    <header class="page-header">
        <div class="brand">this<span>ai</span></div>
        <nav>
            <button id="add-spot-btn" class="nav-btn bg-primary"
                style="margin-right:1rem; border:none; background:#2563eb; color:white; padding: 0.5rem 1rem; border-radius:5px; cursor:pointer;">
                <i class="fas fa-plus"></i> Add Spot
            </button>
            <a href="#" id="back-link" class="nav-btn"><i class="fas fa-arrow-left"></i> Back to City Overview</a>
        </nav>
    </header>

    <div class="container" style="margin-top: 2rem;">
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;" id="page-title">Tourist Places</h1>
        <p style="color:var(--text-gray); margin-bottom: 2rem;">Explore the best spots in the city.</p>

        <div class="places-layout">

            <!-- Left: Places Grid -->
            <div class="places-grid" id="places-grid">
                <!-- Places injected via JS -->
            </div>

            <!-- Right: Interactive Map -->
            <div class="map-sidebar">
                <div id="map-places"></div>
            </div>

        </div>
    </div>

    <!-- Add Spot Modal -->
    <div id="add-spot-modal" class="modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div class="modal-content"
            style="background:white; padding:2rem; border-radius:10px; width:90%; max-width:500px; position:relative;">
            <span class="close-modal" id="close-add-spot"
                style="position:absolute; top:1rem; right:1.5rem; font-size:1.5rem; cursor:pointer;">&times;</span>
            <h2 style="margin-bottom:1.5rem;">Add New Spot</h2>
            <form id="add-spot-form">
                <div style="margin-bottom:1rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Spot Name</label>
                    <input type="text" id="spot-name" required
                        style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:6px;">
                </div>
                <div style="margin-bottom:1rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Description</label>
                    <textarea id="spot-desc" required rows="3"
                        style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:6px;"></textarea>
                </div>
                <div style="margin-bottom:1.5rem;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:500;">Image URL</label>
                    <input type="url" id="spot-image" placeholder="https://example.com/image.jpg"
                        style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:6px;">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:1rem;">
                    <button type="button" id="cancel-add-spot"
                        style="padding:0.7rem 1.5rem; border:1px solid #ddd; background:white; border-radius:6px; cursor:pointer;">Cancel</button>
                    <button type="submit"
                        style="padding:0.7rem 1.5rem; border:none; background:#2563eb; color:white; border-radius:6px; cursor:pointer;">Add
                        Spot</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Scripts -->
    <script src="places-data.js"></script>
    <script src="tourist-places.js"></script>
</body>

</html>
