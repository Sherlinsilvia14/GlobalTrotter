<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThisAI - Smart Travel Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="brand-container">
            <img src="logo.png" alt="THISAI Logo" class="logo-img">
            <div class="logo-text">THIS<span class="logo-highlight">AI</span></div>
        </div>
        <nav class="nav-links">
            <button id="create-trip-btn" class="btn-primary" onclick="window.location.href='create-trip.html'"><i
                    class="fas fa-plus"></i> New Trip</button>
            <button id="logout-btn" class="btn-action edit" style="border:none;">Logout</button>
        </nav>
    </header>

    <main class="main-container">

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="stat-upcoming">0</span>
                <span class="stat-label">Upcoming</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-completed">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-days">0</span>
                <span class="stat-label">Total Days</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-budget">$0</span>
                <span class="stat-label">Planned Budget</span>
            </div>
        </div>

        <div class="section-header">
            <h1>My Trips</h1>
            <div class="filters">
                <select id="year-selector" style="padding: 0.5rem; border-radius: 8px; border: 1px solid #cbd5e0;">
                    <option value="all">All Years</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
        </div>

        <div id="trips-grid" class="dashboard-grid">
            <!-- Trip Cards will be injected here -->
        </div>

        <div id="empty-state" class="empty-state" style="text-align:center; display:none; padding:3rem;">
            <i class="fas fa-plane-slash" style="font-size: 3rem; color: #cbd5e0; margin-bottom: 1rem;"></i>
            <h3>No trips found.</h3>
            <p>Ready to plan your next adventure?</p>
        </div>

    </main>

    <!-- Share Modal -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 style="margin-bottom:0.5rem;">Share Adventure</h3>
            <p id="share-trip-name" style="color:var(--text-muted); margin-bottom:1.5rem;">Trip Name</p>

            <div class="share-options">
                <button class="share-btn whatsapp" onclick="shareAction('whatsapp')"><i
                        class="fab fa-whatsapp"></i></button>
                <button class="share-btn facebook" onclick="shareAction('facebook')"><i
                        class="fab fa-facebook-f"></i></button>
                <button class="share-btn copy" onclick="shareAction('copy')"><i class="fas fa-link"></i></button>
            </div>

            <p id="share-feedback" style="font-size:0.8rem; color: #48bb78; min-height: 1.2em;"></p>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
