<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GlobeTrotter</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <span>🌍</span> GlobeTrotter
        </a>
        <div class="nav-user">
            <div class="user-info">
                Welcome, <span id="user-name-display">Traveler</span>
            </div>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">

        <!-- Welcome Header -->
        <header class="dashboard-header">
            <h1>Overview</h1>
            <p>Plan, organize, and visualize your journeys in one place</p>
        </header>

        <!-- Yearly Overview Section (Now Global) -->
        <section class="stats-overview">
            <div class="stats-controls" style="margin-bottom: 0.5rem;">
                <h2 class="stats-title" style="font-size: 1.5rem;">Total Travel Overview</h2>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="stat-upcoming">0</span>
                    <span class="stat-label">Upcoming Trips</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-completed">0</span>
                    <span class="stat-label">Trips Completed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-days">0</span>
                    <span class="stat-label">Total Travel Days</span>
                </div>
                <!-- Optional: Budget -->
                <div class="stat-card">
                    <span class="stat-value" id="stat-budget">$0</span>
                    <span class="stat-label">Total Est. Budget</span>
                </div>
            </div>
        </section>

        <!-- Primary Action -->
        <div class="action-bar">
            <a href="create-trip.html" class="btn-create-trip">
                <span>+</span> Create New Trip
            </a>
        </div>

        <!-- Trips Grid -->
        <section class="trips-section">
            <div class="section-header">
                <h2 class="section-title">My Trips</h2>
                <select id="year-selector" class="year-selector">
                    <option value="all">All Years</option>
                    <option value="2027">2027</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024" selected>2024</option>
                    <option value="2023">2023</option>
                </select>
            </div>

            <div id="trips-grid" class="trips-grid">
                <!-- Trips injected via JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">🗺️</div>
                <h3>No trips found</h3>
                <p style="color: #6b7280; margin-top: 0.5rem">Start by creating your first journey above.</p>
            </div>
        </section>

    </main>

    <script src="dashboard.js"></script>
</body>

</html>
